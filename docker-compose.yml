version: '3.8'

services:
  # Frontend - Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - portfolio-network
    restart: unless-stopped

  # Backend - Node.js
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - EMAIL_USER=${EMAIL_USER:-tommyramihoatrarivo@gmail.com}
      - EMAIL_PASS=${EMAIL_PASS}
      - PORT=3000
    networks:
      - portfolio-network
    restart: unless-stopped

networks:
  portfolio-network:
    driver: bridge
